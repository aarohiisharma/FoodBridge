name: Backend tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  jest-supertest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Auth tests
            test-file: src/tests/auth.test.js
          - name: Donation tests
            test-file: src/tests/donation.test.js
          - name: Health tests
            test-file: src/tests/health.test.js
          - name: Pickup tests
            test-file: src/tests/pickup.test.js
          - name: Remaining feature tests
            test-file: src/tests/remaining.test.js

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npx jest --runInBand --ci ${{ matrix.test-file }}
